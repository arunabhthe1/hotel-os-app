server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: hotel-os-app
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_os}
    username: ${DB_USERNAME:hotel_os}
    password: ${DB_PASSWORD:hotel_os}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

hotel:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-hotel-os-jwt-signing-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oauth2:
    use-request-origin: ${OAUTH2_USE_REQUEST_ORIGIN:false}
    frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/login}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true 

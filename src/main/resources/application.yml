server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hotel-os-app
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hotel_os?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123#}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

hotel:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-hotel-os-jwt-signing-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oauth2:
    frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/login}
    google:
      client-id: 
      client-secret: 
  razorpay:
    key-id: 
    key-secret: 

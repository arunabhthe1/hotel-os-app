name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [frontend-changed]

permissions:
  contents: read
  id-token: write

env:
  SERVICE: hotel-os
  IMAGE_NAME: hotel-os

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FRONTEND_REPO || format('{0}/hotel-os', github.repository_owner) }}
          ref: ${{ github.event.client_payload.sha || vars.FRONTEND_REF || 'main' }}
          path: frontend
          token: ${{ secrets.FRONTEND_CHECKOUT_TOKEN || github.token }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --build-context frontend=frontend \
            --build-arg "VITE_RAZORPAY_KEY_ID=${{ vars.VITE_RAZORPAY_KEY_ID }}" \
            -t "$IMAGE" \
            -t "${IMAGE%:*}:latest" \
            .
          docker push "$IMAGE"
          docker push "${IMAGE%:*}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          DB_URL="jdbc:postgresql://google/${{ vars.DB_NAME }}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${{ vars.CLOUDSQL_CONNECTION_NAME }}"

          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 3 \
            --cpu-boost \
            --service-account "${{ vars.CLOUD_RUN_RUNTIME_SA }}" \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION_NAME }}" \
            --set-env-vars "^|^DB_URL=${DB_URL}|DB_USERNAME=${{ vars.DB_USERNAME }}|CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173|OAUTH2_USE_REQUEST_ORIGIN=true|GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" \
            --set-secrets "DB_PASSWORD=hotel-os-db-password:latest,JWT_SECRET=hotel-os-jwt-secret:latest,GOOGLE_CLIENT_SECRET=hotel-os-google-client-secret:latest" \
            --startup-probe="httpGet.path=/actuator/health/liveness,periodSeconds=10,failureThreshold=30,timeoutSeconds=3" \
            --liveness-probe="httpGet.path=/actuator/health/liveness,periodSeconds=30,timeoutSeconds=3"
